<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor">
  <rect width="20" height="14" x="2" y="3" rx="2"/>
  <line x1="8" x2="16" y1="21" y2="21"/>
  <line x1="12" x2="12" y1="17" y2="21"/>
  <style>
    :root {
      color-scheme: light dark;
    }
    * {
      stroke: currentColor;
    }
    @media (prefers-color-scheme: dark) {
      * {
        stroke: #fff;
      }
    }
    @media (prefers-color-scheme: light) {
      * {
        stroke: #000;
      }
    }
  </style>
</svg>
